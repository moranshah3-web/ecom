<!DOCTYPE html>
<html lang="en" style="--brand: #dc2626; --ring: #dc2626; --ink: #111111; --brand-foreground: #ffffff; --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — ASHFAQ Shoes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --brand: #dc2626; --ring: #dc2626; --ink: #111111; --surface: #f5f5f5; --border: #e5e5e5; --muted-foreground: #737373; --background: #ffffff; }
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: var(--background); color: var(--ink); margin: 0; -webkit-font-smoothing: antialiased; }
    .container-x { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
    @media (min-width: 640px) { .container-x { padding: 0 1.5rem; } }
    @media (min-width: 1024px) { .container-x { padding: 0 2rem; } }
    .bg-brand { background-color: var(--brand); } .text-brand { color: var(--brand); } .bg-brand\/10 { background-color: rgba(220, 38, 38, 0.1); }
    .bg-ink { background-color: var(--ink); } .text-ink { color: var(--ink); } .bg-surface { background-color: var(--surface); }
    .border-border { border-color: var(--border); } .text-muted-foreground { color: var(--muted-foreground); }
    .bg-background { background-color: var(--background); } .hover\:bg-brand:hover { background-color: var(--brand); }
    .hover\:text-brand:hover { color: var(--brand); } .hover\:bg-ink:hover { background-color: var(--ink); }
    .hover\:text-background:hover { color: var(--background); }
  </style>
</head>
<body>
<div class="bg-ink py-2 text-center text-xs font-medium tracking-wide text-white">Free shipping on orders over Rs. 5,000 · Cash on Delivery available</div>
<header class="sticky top-0 z-50 border-b border-border bg-white/95 backdrop-blur">
  <div class="container-x">
    <div class="flex h-16 items-center gap-4 md:h-20">
      <a href="index.html" class="flex items-center gap-1 shrink-0"><span class="text-xl font-black tracking-tight md:text-2xl">ASHFAQ</span><span class="text-xl font-light tracking-widest text-muted-foreground md:text-2xl">SHOES</span></a>
      <div class="ml-auto flex items-center gap-1">
        <a href="index.html" class="grid h-10 w-10 place-items-center hover:text-brand"><i data-lucide="home" class="h-5 w-5"></i></a>
        <a href="cart.html" class="relative grid h-10 w-10 place-items-center hover:text-brand"><i data-lucide="shopping-bag" class="h-5 w-5"></i><span class="cart-count absolute -right-0 -top-0 grid h-4 w-4 place-items-center rounded-full bg-brand text-[10px] font-bold text-white">0</span></a>
      </div>
    </div>
  </div>
</header>
<main class="container-x py-12">
  <h1 class="text-4xl font-black tracking-tight mb-8">Your Shopping Cart</h1>
  <div id="cart-container"></div>
</main>
<footer class="border-t border-border bg-surface py-10 mt-auto"><div class="container-x text-center text-xs text-muted-foreground">© 2026 ASHFAQ Shoes Palace. All rights reserved.</div></footer>
<script>
  lucide.createIcons();
  function getCart() { return JSON.parse(localStorage.getItem('ashfaq_cart')) || []; }
  function saveCart(cart) { localStorage.setItem('ashfaq_cart', JSON.stringify(cart)); updateCartCount(); }
  function updateCartCount() { const cart = getCart(); const count = cart.reduce((sum, item) => sum + item.qty, 0); document.querySelectorAll('.cart-count').forEach(el => el.textContent = count); }
  
  function renderCart() {
    const cart = getCart();
    const container = document.getElementById('cart-container');
    if (cart.length === 0) {
      container.innerHTML = `<div class="text-center py-16 bg-surface rounded-2xl border border-border"><i data-lucide="shopping-bag" class="h-16 w-16 text-muted-foreground mx-auto mb-4"></i><h2 class="text-2xl font-bold">Your cart is empty</h2><p class="mt-2 text-muted-foreground">Looks like you haven't added anything yet.</p><a href="page.html?title=Shop+All" class="mt-6 inline-block rounded-md bg-ink px-8 py-3.5 text-sm font-bold uppercase tracking-wide text-white transition hover:bg-brand">Start Shopping</a></div>`;
      lucide.createIcons(); return;
    }
    let itemsHTML = ''; let subtotal = 0;
    cart.forEach((item, index) => {
      const priceNum = parseInt(item.price.replace(/[^0-9]/g, ''));
      subtotal += priceNum * item.qty;
      itemsHTML += `<div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 py-6 border-b border-border"><img src="${item.image}" alt="${item.name}" class="w-24 h-24 rounded-xl object-cover bg-surface"><div class="flex-1"><h3 class="font-bold text-lg">${item.name}</h3><p class="text-sm text-muted-foreground">Size: ${item.size}</p><p class="text-sm font-bold text-brand mt-1">${item.price}</p></div><div class="flex items-center gap-4"><div class="flex items-center rounded-md border border-border"><button onclick="updateQty(${index}, -1)" class="grid h-8 w-8 place-items-center font-bold hover:bg-surface">−</button><span class="grid h-8 w-8 place-items-center text-sm font-bold">${item.qty}</span><button onclick="updateQty(${index}, 1)" class="grid h-8 w-8 place-items-center font-bold hover:bg-surface">+</button></div><button onclick="removeItem(${index})" class="text-muted-foreground hover:text-brand"><i data-lucide="trash-2" class="h-5 w-5"></i></button></div></div>`;
    });
    const shipping = subtotal > 5000 ? 0 : 250;
    const total = subtotal + shipping;
    container.innerHTML = `<div class="grid gap-8 lg:grid-cols-3"><div class="lg:col-span-2"><div class="bg-white rounded-2xl border border-border p-6">${itemsHTML}</div></div><div class="lg:col-span-1"><div class="bg-surface rounded-2xl border border-border p-6 sticky top-24"><h2 class="text-xl font-black uppercase tracking-wide mb-4">Order Summary</h2><div class="space-y-3 text-sm"><div class="flex justify-between"><span class="text-muted-foreground">Subtotal</span><span class="font-bold">Rs. ${subtotal.toLocaleString()}</span></div><div class="flex justify-between"><span class="text-muted-foreground">Shipping</span><span class="font-bold">${shipping === 0 ? 'Free' : 'Rs. ' + shipping}</span></div><div class="border-t border-border pt-3 flex justify-between text-lg font-black"><span>Total</span><span class="text-brand">Rs. ${total.toLocaleString()}</span></div></div><a href="checkout.html" class="w-full mt-6 block text-center rounded-md bg-brand px-6 py-4 text-sm font-bold uppercase tracking-wide text-white transition hover:bg-ink">Proceed to Checkout</a><div class="mt-4 text-center text-xs text-muted-foreground flex items-center justify-center gap-1"><i data-lucide="shield-check" class="h-3 w-3"></i> Secure Checkout</div></div></div></div>`;
    lucide.createIcons();
  }
  function updateQty(index, amount) { let cart = getCart(); cart[index].qty += amount; if (cart[index].qty < 1) cart[index].qty = 1; saveCart(cart); renderCart(); }
  function removeItem(index) { let cart = getCart(); cart.splice(index, 1); saveCart(cart); renderCart(); }
  renderCart(); updateCartCount();
</script>
</body>
</html>
